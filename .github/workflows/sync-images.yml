name: Sync Images to R2

on:
  schedule:
    # Chạy vào 20:00 UTC (tương đương 3:00 sáng giờ VN) mỗi ngày
    - cron: '0 20 * * *'
  # Cho phép kích hoạt chạy tay bằng nút "Run workflow" trên GitHub
  workflow_dispatch:
    inputs:
      args:
        description: 'Tham số chạy sync ảnh'
        required: false
        default: '--new-only --max-pages=15 --page-concurrency=3'

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run Sync Images Script
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          BACKEND_API_URL: ${{ secrets.BACKEND_API_URL || 'https://www.munos.store/api/v1' }}
          SYNC_SECRET_KEY: ${{ secrets.SYNC_SECRET_KEY || secrets.SERVER_PASSWORD }}
        # Chạy tay dùng input; cron quét 15 trang mới nhất qua Backend API (munos.store).
        # Không dùng --public-api-only: GitHub Actions dùng Azure IP bị NguonC/Cloudflare block.
        # Backend API trên VPS không bị chặn, trả đủ data cả 3 nguồn (KK + VS + NC).
        run: node scripts/sync-images.mjs ${{ github.event.inputs.args || '--new-only --max-pages=15 --page-concurrency=3' }}
